name: PR checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

# Cancel previous runs of this workflow that are still in progress.
concurrency:
  group: ${{ github.ref }}/checks
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  # This is required for actions/checkout
  contents: read

jobs:
  run_code_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: radfact
          environment-file: dev_environment.yaml

      - name: Install repo packages
        run: make setup_packages
        shell: bash -el {0}

      - name: Run Flake8
        if: ${{ always() }}
        run: make flake8
        shell: bash -el {0}

      - name: Run Black
        if: ${{ always() }}
        run: make blackcheck
        shell: bash -el {0}

      - name: Run Mypy
        if: ${{ always() }}
        run: make mypy
        shell: bash -el {0}

  run_pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: radfact
          environment-file: dev_environment.yaml

      - name: Install repo packages
        run: make setup_packages
        shell: bash -el {0}

      - name: Run pytest
        run: pytest
        shell: bash -el {0}
